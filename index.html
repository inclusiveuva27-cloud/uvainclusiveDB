<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>විශේෂ අධ්‍යාපන අවශ්‍යතා තක්සේරු වාර්තාව</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152238;
    --navy:#1b3d8f;
    --navy-deep:#0f2158;
    --paper:#f4f7fc;
    --paper-raised:#ffffff;
    --line:#d9e2f1;
    --amber:#f2a33d;
    --amber-soft:#fde9cd;
    --teal:#2f9e4f;
    --teal-soft:#dcf3e2;
    --red:#e0356b;
    --purple:#7c4fbf;
    --grey:#6b7690;

    --fs-scale:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{font-size:calc(16px * var(--fs-scale));}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Sinhala','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- Top banner ---------- */
  .top-banner{width:100%; aspect-ratio:1983/502; max-height:340px; overflow:hidden; background:#fff; border-bottom:3px solid var(--navy);}
  .top-banner img{width:100%; height:100%; display:block; object-fit:cover; object-position:center;}

  /* ---------- Accessibility bar ---------- */
  .a11y-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--navy-deep); color:#e7e2d4; padding:7px 18px;
    font-family:'Space Mono',monospace; font-size:11px; flex-wrap:wrap;
  }
  .a11y-bar .fs-controls{display:flex; align-items:center; gap:10px;}
  #liveDateTime{
    font-family:'Noto Sans Sinhala','Space Mono',monospace; font-size:11.5px; color:#e7e2d4; opacity:.9;
  }
  .a11y-bar span{opacity:.8; margin-right:2px;}
  .fs-btn{
    width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,0.25);
    background:transparent; color:#e7e2d4; cursor:pointer; font-family:'Space Mono',monospace;
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .fs-btn:hover{background:var(--amber); border-color:var(--amber); color:#1a1206; transform:translateY(-1px);}
  .fs-reset{
    font-size:10.5px; padding:5px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.25);
    background:transparent; color:#e7e2d4; cursor:pointer; font-family:inherit; transition:all .15s ease;
  }
  .fs-reset:hover{background:rgba(255,255,255,0.12); color:#fff;}

  /* ---------- Layout shell ---------- */
  .app{display:flex; min-height:100vh;}
  .rail{
    width:230px; flex-shrink:0;
    background:var(--navy-deep);
    color:#e7e2d4;
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  .rail-head{padding:22px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.1);}
  .rail-head .eyebrow{
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--amber-soft); opacity:.85;
  }
  .rail-head h1{font-size:15px; line-height:1.5; margin:6px 0 0; font-weight:600; color:#fff;}

  .gauge-wrap{padding:18px; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center;}
  .gauge{position:relative; width:112px; height:112px; margin:0 auto;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-track{stroke:rgba(255,255,255,0.12); fill:none;}
  .gauge-fill{stroke:var(--amber); fill:none; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
  .gauge-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-num .val{font-family:'Space Mono',monospace; font-size:20px; font-weight:700; color:#fff;}
  .gauge-num .max{font-size:10px; color:#a9a291;}

  nav.sections{padding:10px 0; flex:1;}
  .nav-group-label{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#7a7566; padding:12px 18px 4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 18px; cursor:pointer; font-size:13.5px;
    border-left:3px solid transparent;
    color:#cfc9ba;
  }
  .nav-item:hover{background:rgba(255,255,255,0.04); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.07); border-left-color:var(--amber); color:#fff;}
  .nav-item .tag{
    font-family:'Space Mono',monospace; font-size:10px; color:#8a8371;
    width:30px; flex-shrink:0;
  }
  .nav-item .prog{margin-left:auto; font-family:'Space Mono',monospace; font-size:10px; color:#8a8371;}
  .nav-item.done .prog{color:var(--teal-soft);}
  .nav-item.done .tag{color:var(--amber);}

  .rail-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.1); display:flex; gap:8px; flex-wrap:wrap;}
  .rail-btn{
    flex:1; min-width:80px; text-align:center; font-size:11.5px; padding:8px 6px;
    border-radius:5px; border:1px solid rgba(255,255,255,0.18); color:#e7e2d4; background:transparent;
    cursor:pointer; font-family:inherit;
  }
  .rail-btn:hover{background:rgba(255,255,255,0.08);}
  .rail-btn.primary{background:var(--amber); border-color:var(--amber); color:#1a1206; font-weight:600;}
  .rail-btn.primary:hover{background:#e0913a; transform:translateY(-1px); box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .rail-btn:not(.primary):hover{transform:translateY(-1px);}

  .rail-outline-btn{
    border:1px solid rgba(255,255,255,0.25); background:transparent; color:#e7e2d4;
    cursor:pointer; font-family:inherit; transition:all .15s ease; border-radius:5px;
  }
  .rail-outline-btn:hover{background:var(--amber); border-color:var(--amber); color:#1a1206; transform:translateY(-1px);}

  /* ---------- Main ---------- */
  main{flex:1; padding:34px 44px 80px; max-width:920px;}
  .crumb{font-family:'Space Mono',monospace; font-size:11px; color:var(--grey); text-transform:uppercase; letter-spacing:.08em;}
  .panel-title{font-size:23px; font-weight:700; margin:6px 0 2px; color:var(--navy-deep);}
  .panel-sub{color:var(--grey); font-size:13.5px; margin-bottom:26px;}

  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:26px 28px; margin-bottom:20px;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px 22px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--grey); font-weight:600;}
  .field input, .field select, .field textarea{
    font-family:inherit; font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:6px; background:#fdfcf9; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  .field.span2{grid-column:span 2;}
  textarea{resize:vertical; min-height:60px;}

  .sib-table, .comm-table{width:100%; border-collapse:collapse; margin-top:8px;}
  .sib-table th, .sib-table td, .comm-table th, .comm-table td{
    border:1px solid var(--line); padding:7px 8px; font-size:12.5px;
  }
  .sib-table th, .comm-table th{background:#e7edfb; text-align:left; font-weight:600; color:var(--navy-deep);}
  .sib-table input, .comm-table input{width:100%; border:none; background:transparent; font-family:inherit; font-size:12.5px; padding:2px;}
  .sib-table input:focus, .comm-table input:focus{outline:1px solid var(--amber); background:#fffdf6;}

  /* Section legend */
  .legend{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .legend .lg-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--grey); background:#eef2fb; border:1px solid var(--line); padding:5px 10px; border-radius:20px;}
  .lg-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .verify-note{
    font-size:12px; color:var(--red); background:#f7e9e5; border:1px solid #e3bcb2;
    padding:9px 12px; border-radius:6px; margin-bottom:16px; display:flex; gap:8px; align-items:flex-start;
  }

  .item-row{
    display:flex; align-items:center; gap:14px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-no{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--grey);
    width:24px; flex-shrink:0; text-align:right;
  }
  .item-text{flex:1; font-size:14.5px; line-height:1.55;}
  .item-text .flag{color:var(--red); font-size:11px; margin-left:4px; cursor:help; font-family:'Space Mono',monospace;}
  .score-btns{display:flex; gap:5px; flex-shrink:0;}
  .score-btn{
    width:34px; height:34px; border-radius:7px; border:1px solid var(--line);
    background:#fdfcf9; font-family:'Space Mono',monospace; font-weight:700; font-size:13px;
    cursor:pointer; color:var(--ink); transition:all .12s ease;
  }
  .score-btn:hover{border-color:var(--amber); transform:translateY(-2px); box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .score-btn.sel-4{background:var(--teal); border-color:var(--teal); color:#fff;}
  .score-btn.sel-3{background:#8fd19f; border-color:#8fd19f; color:#123;}
  .score-btn.sel-2{background:var(--amber-soft); border-color:var(--amber); color:#5c3c14;}
  .score-btn.sel-1{background:var(--red); border-color:var(--red); color:#fff;}

  .section-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; padding-top:14px; border-top:2px solid var(--navy-deep);
    font-family:'Space Mono',monospace; font-size:13px;
  }
  .section-foot .total{font-weight:700; color:var(--navy-deep); font-size:16px;}

  .summary-table{width:100%; border-collapse:collapse; margin-top:6px;}
  .summary-table th, .summary-table td{border:1px solid var(--line); padding:9px 12px; font-size:13.5px; text-align:left;}
  .summary-table th{background:#e7edfb; color:var(--navy-deep);}
  .summary-table td.num{font-family:'Space Mono',monospace; text-align:right;}
  .summary-table tr.grand td{font-weight:700; background:var(--amber-soft);}
  .bar-cell{width:180px;}
  .bar-track{background:#dde6f7; border-radius:6px; height:8px; overflow:hidden;}
  .bar-fill{background:var(--teal); height:100%; border-radius:6px;}

  .filter-bar{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;}
  .filter-bar .field{min-width:150px; flex:1;}
  .filter-bar .field.grow{flex:2; min-width:200px;}
  .filter-bar .field.small{min-width:110px; flex:0 0 110px;}
  .filter-reset{
    font-size:12px; padding:9px 14px; border-radius:6px; border:1px solid var(--line);
    background:#fdfcf9; color:var(--grey); cursor:pointer; font-family:inherit;
  }
  .filter-reset:hover{border-color:var(--amber); color:var(--ink);}
  .case-table{width:100%; border-collapse:collapse; margin-top:4px;}
  .case-table th, .case-table td{border:1px solid var(--line); padding:9px 11px; font-size:13px; text-align:left;}
  .case-table th{background:#e7edfb; color:var(--navy-deep);}
  .case-table td.num{font-family:'Space Mono',monospace; text-align:right;}
  .case-table tbody tr{cursor:pointer;}
  .case-table tbody tr:hover{background:#eaf1ff;}
  .case-badge{font-size:10.5px; font-family:'Space Mono',monospace; padding:2px 7px; border-radius:20px; display:inline-block;}
  .case-badge.complete{background:var(--teal-soft); color:var(--teal);}
  .case-badge.partial{background:var(--amber-soft); color:#8a5a1e;}
  .case-empty{padding:26px; text-align:center; color:var(--grey); font-size:13px;}
  .case-count{font-family:'Space Mono',monospace; font-size:12px; color:var(--grey); margin-bottom:10px;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--navy-deep); color:#fff;
    padding:11px 18px; border-radius:7px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.25);
    opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  @media print{
    .rail, .toast{display:none !important;}
    main{max-width:100%; padding:0;}
    .card{break-inside:avoid; box-shadow:none;}
  }
  @media (max-width: 860px){
    .app{flex-direction:column;}
    .rail{position:relative; height:auto; width:100%;}
    main{padding:22px;}
    .grid2{grid-template-columns:1fr;}
    .field.span2{grid-column:span 1;}
    .top-banner{max-height:130px;}
    .a11y-bar{justify-content:center; flex-wrap:wrap;}
  }
</style>

window.addEventListener('DOMContentLoaded', () => {
  loadDraftOnStart();
  updateLiveDateTime();
  setInterval(updateLiveDateTime, 1000);
  renderRailNav();
  switchSection(currentState.currentSection);
  updateGauge();
});

function updateLiveDateTime() {
  const el = document.getElementById('liveDateTime');
  if (!el) return;
  const now = new Date();
  const options = { 
    year: 'numeric', month: 'long', day: 'numeric', 
    weekday: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' 
  };
  el.textContent = now.toLocaleDateString('si-LK', options);
}

// Accessibility FS Adjuster
function adjustFS(delta) {
  let scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs-scale')) || 1;
  scale += delta * 0.1;
  if(scale < 0.8) scale = 0.8;
  if(scale > 1.4) scale = 1.4;
  document.documentElement.style.setProperty('--fs-scale', scale);
  showToast(`අකුරු ප්‍රමාණය: ${Math.round(scale*100)}%`);
}

function resetFS() {
  document.documentElement.style.setProperty('--fs-scale', 1);
  showToast(`අකුරු ප්‍රමාණය සාමාන්‍ය තත්වයට පත් කරන ලදී.`);
}

// ==========================================
// NAVIGATION & RENDERING
// ==========================================
function renderRailNav() {
  const nav = document.getElementById('railNav');
  nav.innerHTML = '';

  let currentGroup = '';

  SECTIONS.forEach(sec => {
    // Add Labels for structure
    if (sec.id === 'sec-info') {
      const lbl = document.createElement('div');
      lbl.className = 'nav-group-label';
      lbl.textContent = 'ප්‍රධාන අංශ';
      nav.appendChild(lbl);
    } else if (sec.id === 'sec-a') {
      const lbl = document.createElement('div');
      lbl.className = 'nav-group-label';
      lbl.textContent = 'තක්සේරු ක්ෂේත්‍ර (A-K)';
      nav.appendChild(lbl);
    }

    const item = document.createElement('div');
    item.className = `nav-item ${sec.id === currentState.currentSection ? 'active' : ''}`;
    item.id = `nav-${sec.id}`;
    item.onclick = () => switchSection(sec.id);

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = sec.tag;

    const label = document.createElement('span');
    label.style.flex = '1';
    label.textContent = sec.name;

    const prog = document.createElement('span');
    prog.className = 'prog';
    prog.id = `prog-${sec.id}`;
    prog.textContent = getSectionProgressText(sec.id);

    item.appendChild(tag);
    item.appendChild(label);
    item.appendChild(prog);

    nav.appendChild(item);
  });
}

function getSectionProgressText(secId) {
  if (secId === 'sec-info' || secId === 'sec-sum' || secId === 'sec-cases') return '';
  const items = ITEMS.sec[secId] || [];
  let done = 0;
  items.forEach(it => {
    if (currentState.scores[it.id] !== undefined) done++;
  });
  return `${done}/${items.length}`;
}

function updateNavProgress() {
  SECTIONS.forEach(sec => {
    const el = document.getElementById(`prog-${sec.id}`);
    const navEl = document.getElementById(`nav-${sec.id}`);
    if (el) {
      el.textContent = getSectionProgressText(sec.id);
      if (sec.id.startsWith('sec-') && sec.id !== 'sec-info' && sec.id !== 'sec-sum' && sec.id !== 'sec-cases') {
        const items = ITEMS.sec[sec.id] || [];
        let done = 0;
        items.forEach(it => { if (currentState.scores[it.id] !== undefined) done++; });
        if (done === items.length && items.length > 0) {
          navEl.classList.add('done');
        } else {
          navEl.classList.remove('done');
        }
      }
    }
  });
}

function switchSection(secId) {
  currentState.currentSection = secId;

  // Update nav active state
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeNav = document.getElementById(`nav-${secId}`);
  if (activeNav) activeNav.classList.add('active');

  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  const secObj = SECTIONS.find(s => s.id === secId);

  // Render Breadcrumb & Title
  const crumb = document.createElement('div');
  crumb.className = 'crumb';
  crumb.textContent = `තක්සේරු වාර්තාව / ${secObj ? secObj.name : ''}`;
  main.appendChild(crumb);

  const title = document.createElement('h2');
  title.className = 'panel-title';
  title.textContent = secObj ? `${secObj.tag}. ${secObj.name}` : '';
  main.appendChild(title);

  if (secId === 'sec-info') {
    renderInfoSection(main);
  } else if (secId === 'sec-cases') {
    renderCasesSection(main);
  } else if (secId === 'sec-sum') {
    renderSummarySection(main);
  } else {
    renderAssessmentSection(main, secId);
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

          <th style="width:130px;">දිනය</th>
          <th style="width:160px;">වර්ගය / මාතෘකාව</th>
          <th>විශේෂ සටහන</th>

function updateInfoField(field, val) {
  currentState.info[field] = val;
  autoSaveDraft();
}

function updateSibling(idx, field, val) {
  if (!currentState.info.siblings[idx]) return;
  currentState.info.siblings[idx][field] = val;
  autoSaveDraft();
}

function addSiblingRow() {
  currentState.info.siblings.push({ name: '', age: '', edu: '', notes: '' });
  switchSection('sec-info');
}

function updateCommHistory(idx, field, val) {
  if (!currentState.info.commHistory[idx]) return;
  currentState.info.commHistory[idx][field] = val;
  autoSaveDraft();
}

function addCommRow() {
  currentState.info.commHistory.push({ date: '', type: '', notes: '' });
  switchSection('sec-info');
}

// ==========================================
// RENDER SECTION: DIRECTORY / CASES
// ==========================================
function renderCasesSection(container) {
  const sub = document.createElement('div');
  sub.className = 'panel-sub';
  sub.textContent = 'පද්ධතියේ සුරක්ෂිත කර ඇති සියලුම ළමුන්ගේ වාර්තා මෙහි නරඹන්න, සෙවුම් කරන්න හෝ කළමනාකරණය කරන්න.';
  container.appendChild(sub);

  const card = document.createElement('div');
  card.className = 'card';

  // Filter Bar
  const filterDiv = document.createElement('div');
  filterDiv.className = 'filter-bar';
  filterDiv.innerHTML = `
    <div class="field grow">
      <label>නම / පාසල සෙවීම</label>
      <input type="text" id="filter-search" placeholder="නම හෝ පාසල ටයිප් කරන්න..." value="${escapeHtml(directoryFilters.search)}" oninput="updateDirectoryFilters('search', this.value)">
    </div>
    <div class="field">
      <label>ශ්‍රේණිය</label>
      <select id="filter-grade" onchange="updateDirectoryFilters('grade', this.value)">
        <option value="ALL">සියලුම ශ්‍රේණි</option>
        ${getUniqueGradesOptions()}
      </select>
    </div>
    <div class="field small">
      <label>භාවය</label>
      <select id="filter-gender" onchange="updateDirectoryFilters('gender', this.value)">
        <option value="ALL">සියල්ල</option>
        <option value="පිරිමි" ${directoryFilters.gender==='පිරිමි'?'selected':''}>පිරිමි</option>
        <option value="ගැහැණු" ${directoryFilters.gender==='ගැහැණු'?'selected':''}>ගැහැණු</option>
      </select>
    </div>
    <div class="field small">
      <label>තත්වය</label>
      <select id="filter-status" onchange="updateDirectoryFilters('status', this.value)">
        <option value="ALL">සියල්ල</option>
        <option value="COMPLETE" ${directoryFilters.status==='COMPLETE'?'selected':''}>සම්පූර්ණයි</option>
        <option value="PARTIAL" ${directoryFilters.status==='PARTIAL'?'selected':''}>අසම්පූර්ණයි</option>
      </select>
    </div>
    <button class="filter-reset" onclick="resetDirectoryFilters()">Reset</button>
  `;
  card.appendChild(filterDiv);

  // Table Container
  const listWrap = document.createElement('div');
  listWrap.id = 'directory-list-wrap';
  card.appendChild(listWrap);

  container.appendChild(card);

  renderDirectoryList();
}

function getUniqueGradesOptions() {
  const grades = new Set();
  currentState.cases.forEach(c => {
    if (c.info && c.info.grade) grades.add(c.info.grade);
  });
  let html = '';
  grades.forEach(g => {
    html += `<option value="${escapeHtml(g)}" ${directoryFilters.grade===g?'selected':''}>${escapeHtml(g)}</option>`;
  });
  return html;
}

function updateDirectoryFilters(key, val) {
  directoryFilters[key] = val;
  renderDirectoryList();
}

function resetDirectoryFilters() {
  directoryFilters = { search: '', grade: 'ALL', gender: 'ALL', status: 'ALL' };
  switchSection('sec-cases');
}

function renderDirectoryList() {
  const wrap = document.getElementById('directory-list-wrap');
  if (!wrap) return;

  let filtered = currentState.cases.filter(c => {
    const sName = (c.info && c.info.studentName) ? c.info.studentName.toLowerCase() : '';
    const sSch = (c.info && c.info.school) ? c.info.school.toLowerCase() : '';
    const q = directoryFilters.search.toLowerCase();

    if (q && !sName.includes(q) && !sSch.includes(q)) return false;
    if (directoryFilters.grade !== 'ALL' && c.info && c.info.grade !== directoryFilters.grade) return false;
    if (directoryFilters.gender !== 'ALL' && c.info && c.info.gender !== directoryFilters.gender) return false;

    // Calculate completion status
    const sc = c.scores || {};
    const filledCount = Object.keys(sc).length;
    const isComplete = filledCount >= 176;

    if (directoryFilters.status === 'COMPLETE' && !isComplete) return false;
    if (directoryFilters.status === 'PARTIAL' && isComplete) return false;

    return true;
  });

  if (filtered.length === 0) {
    wrap.innerHTML = `<div class="case-empty">වාර්තා කිසිවක් හමු නොවීය. (සුරකින ලද වාර්තා නොමැත හෝ සෙවුම් කොන්දේසි වලට ගැලපෙන්නේ නැත)</div>`;
    return;
  }

  let html = `
    <div class="case-count">මුළු වාර්තා ගණන: ${filtered.length}</div>
    <table class="case-table">
      <thead>
        <tr>
          <th>ශිෂ්‍යයාගේ නම</th>
          <th>ශ්‍රේණිය</th>
          <th>පාසල</th>
          <th>තක්සේරු කළ දිනය</th>
          <th style="text-align:right;">ලකුණු</th>
          <th style="text-align:center;">තත්වය</th>
          <th style="text-align:center;">ක්‍රියාමාර්ග</th>
        </tr>
      </thead>
      <tbody>
  `;

  filtered.forEach((c, idx) => {
    const filledCount = Object.keys(c.scores || {}).length;
    let totalScore = 0;
    Object.values(c.scores || {}).forEach(v => totalScore += Number(v));

    const isComplete = filledCount >= 176;
    const badgeHtml = isComplete 
      ? `<span class="case-badge complete">සම්පූර්ණයි</span>`
      : `<span class="case-badge partial">අසම්පූර්ණයි (${filledCount}/176)</span>`;

    html += `
      <tr>
        <td style="font-weight:600; color:var(--navy-deep);">${escapeHtml(c.info.studentName || 'නමක් සඳහන් නැත')}</td>
        <td>${escapeHtml(c.info.grade || '-')}</td>
        <td>${escapeHtml(c.info.school || '-')}</td>
        <td>${c.info.assessmentDate || '-'}</td>
        <td class="num">${totalScore}</td>
        <td style="text-align:center;">${badgeHtml}</td>
        <td style="text-align:center;">
          <button class="rail-outline-btn" style="padding:3px 8px; font-size:11px; color:var(--navy-deep); border-color:var(--line);" onclick="loadCaseRecord(${c.id})">ලෝඩ් කරන්න</button>
          <button class="rail-outline-btn" style="padding:3px 8px; font-size:11px; color:var(--red); border-color:var(--line);" onclick="deleteCaseRecord(${c.id})">මකන්න</button>
        </td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function loadCaseRecord(caseId) {
  const item = currentState.cases.find(c => c.id === caseId);
  if (!item) return;

  currentState.info = JSON.parse(JSON.stringify(item.info));
  currentState.scores = JSON.parse(JSON.stringify(item.scores));
  updateGauge();
  updateNavProgress();
  showToast(`වාර්තාව සාර්ථකව පද්ධතියට ලෝඩ් කරන ලදී.`);
  switchSection('sec-info');
}

function deleteCaseRecord(caseId) {
  if (!confirm('මෙම වාර්තාව පද්ධතියෙන් ඉවත් කිරීමට ඔබට විශ්වාසද?')) return;
  currentState.cases = currentState.cases.filter(c => c.id !== caseId);
  autoSaveDraft();
  renderDirectoryList();
  showToast('වාර්තාව ඉවත් කරන ලදී.');
}

function renderAssessmentSection(container, secId) {
  const items = ITEMS.sec[secId] || [];

  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `
    <div class="lg-item"><span class="lg-dot" style="background:var(--teal);"></span> 4 = ස්වාධීනව සිදු කරයි</div>
    <div class="lg-item"><span class="lg-dot" style="background:#8fd19f;"></span> 3 = සුළු උපකාර සහිතව</div>
    <div class="lg-item"><span class="lg-dot" style="background:var(--amber);"></span> 2 = වැඩි උපකාර සහිතව</div>
    <div class="lg-item"><span class="lg-dot" style="background:var(--red);"></span> 1 = සිදු කළ නොහැක</div>
  `;
  container.appendChild(legend);

  const card = document.createElement('div');
  card.className = 'card';

  let secTotal = 0;
  let secFilled = 0;

  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const currentScore = currentState.scores[item.id];
    if (currentScore !== undefined) {
      secTotal += Number(currentScore);
      secFilled++;
    }

    const flagHtml = item.flag ? `<span class="flag" title="${item.flag}">[!]</span>` : '';

    row.innerHTML = `
      <div class="item-no">${idx + 1}.</div>
      <div class="item-text">${item.text} ${flagHtml}</div>
      <div class="score-btns">
        <button class="score-btn ${currentScore === 4 ? 'sel-4' : ''}" onclick="setScore('${item.id}', 4, '${secId}')">4</button>
        <button class="score-btn ${currentScore === 3 ? 'sel-3' : ''}" onclick="setScore('${item.id}', 3, '${secId}')">3</button>
        <button class="score-btn ${currentScore === 2 ? 'sel-2' : ''}" onclick="setScore('${item.id}', 2, '${secId}')">2</button>
        <button class="score-btn ${currentScore === 1 ? 'sel-1' : ''}" onclick="setScore('${item.id}', 1, '${secId}')">1</button>
      </div>
    `;

    card.appendChild(row);
  });

  // Section Foot (Total)
  const foot = document.createElement('div');
  foot.className = 'section-foot';
  foot.innerHTML = `
    <div>සම්පූර්ණ කළ ප්‍රමාණය: ${secFilled} / ${items.length}</div>
    <div class="total">මෙම අංශයේ එකතුව: <span id="sec-total-val">${secTotal}</span> / ${items.length * 4}</div>
  `;
  card.appendChild(foot);

  container.appendChild(card);

  // Bottom Nav Buttons
  const navBtns = document.createElement('div');
  navBtns.style.display = 'flex';
  navBtns.style.justifyContent = 'space-between';
  navBtns.style.marginTop = '20px';

  const currentIndex = SECTIONS.findIndex(s => s.id === secId);
  const prevSec = SECTIONS[currentIndex - 1];
  const nextSec = SECTIONS[currentIndex + 1];

  let leftBtnHtml = prevSec ? `<button class="rail-btn" style="padding:10px 20px; font-size:13px;" onclick="switchSection('${prevSec.id}')">&larr; ${prevSec.name}</button>` : '<div></div>';
  let rightBtnHtml = nextSec ? `<button class="rail-btn primary" style="padding:10px 20px; font-size:13px;" onclick="switchSection('${nextSec.id}')">${nextSec.name} &rarr;</button>` : '';

  navBtns.innerHTML = leftBtnHtml + rightBtnHtml;
  container.appendChild(navBtns);
}

function setScore(itemId, scoreVal, secId) {
  if (currentState.scores[itemId] === scoreVal) {
    delete currentState.scores[itemId]; // Toggle off if clicked again
  } else {
    currentState.scores[itemId] = scoreVal;
  }

  updateGauge();
  updateNavProgress();
  autoSaveDraft();

  // Re-render section to reflect selected state
  switchSection(secId);
}

// RENDER SECTION: SUMMARY REPORT
// ==========================================
function renderSummarySection(container) {
  const sub = document.createElement('div');
  sub.className = 'panel-sub';
  sub.textContent = 'සියලුම ක්ෂේත්‍රයන්හි තක්සේරු ලකුණු සංසන්දනය සහ සමස්ත ප්‍රතිඵල සාරාංශය.';
  container.appendChild(sub);

  const card = document.createElement('div');
  card.className = 'card';

  let grandTotal = 0;
  let maxGrandTotal = 44 * 16; // 176 items * 4 = 704
  let totalItemsCount = 0;
  let totalFilledCount = 0;

  let tableRowsHtml = '';

  SECTIONS.forEach(sec => {
    if (sec.id === 'sec-info' || sec.id === 'sec-sum' || sec.id === 'sec-cases') return;
    const items = ITEMS.sec[sec.id] || [];
    let secScore = 0;
    let secFilled = 0;

    items.forEach(it => {
      totalItemsCount++;
      if (currentState.scores[it.id] !== undefined) {
        secScore += Number(currentState.scores[it.id]);
        secFilled++;
        totalFilledCount++;
      }
    });

    grandTotal += secScore;
    const maxSecScore = items.length * 4;
    const pct = maxSecScore > 0 ? Math.round((secScore / maxSecScore) * 100) : 0;

    tableRowsHtml += `
      <tr>
        <td style="font-weight:600; color:var(--navy-deep);">${sec.tag}. ${sec.name}</td>
        <td class="num">${secFilled} / ${items.length}</td>
        <td class="num" style="font-weight:700;">${secScore} / ${maxSecScore}</td>
        <td class="bar-cell">
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;"></div>
          </div>
        </td>
        <td class="num" style="font-weight:600; color:var(--navy);">${pct}%</td>
      </tr>
    `;
  });

  const grandPct = Math.round((grandTotal / (totalItemsCount * 4)) * 100) || 0;

  card.innerHTML = `
    <h3 style="font-size:16px; margin:0 0 14px; color:var(--navy-deep);">ක්ෂේත්‍ර අනුව ලකුණු විශ්ලේෂණය</h3>
    <table class="summary-table">
      <thead>
        <tr>
          <th>ක්ෂේත්‍රය</th>
          <th style="text-align:right;">සම්පූර්ණ ප්‍රමාණය</th>
          <th style="text-align:right;">ලබාගත් ලකුණු</th>
          <th>ප්‍රගති ප්‍රස්ථාරය</th>
          <th style="text-align:right;">ප්‍රතිශතය</th>
        </tr>
      </thead>
      <tbody>
        ${tableRowsHtml}
        <tr class="grand">
          <td>එකතුව / සමස්ත ප්‍රතිඵලය</td>
          <td class="num">${totalFilledCount} / ${totalItemsCount}</td>
          <td class="num" style="font-size:16px;">${grandTotal} / ${totalItemsCount * 4}</td>
          <td class="bar-cell">
            <div class="bar-track" style="height:10px; background:#c5d5f5;">
              <div class="bar-fill" style="width:${grandPct}%; background:var(--amber);"></div>
            </div>
          </td>
          <td class="num" style="font-size:16px; color:var(--navy-deep);">${grandPct}%</td>
        </tr>
      </tbody>
    </table>
  `;

  container.appendChild(card);

  // Summary Actions
  const actCard = document.createElement('div');
  actCard.className = 'card';
  actCard.style.display = 'flex';
  actCard.style.gap = '12px';
  actCard.style.justifyContent = 'flex-end';

  actCard.innerHTML = `
    <button class="rail-btn" style="padding:10px 20px; color:var(--ink); border-color:var(--line);" onclick="window.print()">මුද්‍රණය කරන්න (Print / PDF)</button>
    <button class="rail-btn primary" style="padding:10px 20px;" onclick="saveCurrentToDirectory()">මෙම වාර්තාව නාමාවලියට සුරකින්න</button>
  `;

  container.appendChild(actCard);
}

function saveCurrentToDirectory() {
  if (!currentState.info.studentName) {
    alert('කරුණාකර ප්‍රථමයෙන් ශිෂ්‍යයාගේ නම ඇතුළත් කරන්න.');
    switchSection('sec-info');
    return;
  }

  const existingIdx = currentState.cases.findIndex(c => c.id === currentState.info.id);

  const record = {
    id: currentState.info.id || Date.now(),
    info: JSON.parse(JSON.stringify(currentState.info)),
    scores: JSON.parse(JSON.stringify(currentState.scores)),
    savedAt: new Date().toISOString()
  };

  currentState.info.id = record.id;

  if (existingIdx >= 0) {
    currentState.cases[existingIdx] = record;
  } else {
    currentState.cases.push(record);
  }

  autoSaveDraft();
  showToast('වාර්තාව සාර්ථකව නාමාවලියට සුරකින ලදී!');
}

// ==========================================
// GAUGE & STATS LOGIC
// ==========================================
function updateGauge() {
  const filledCount = Object.keys(currentState.scores).length;
  const totalItems = 176;

  const valEl = document.getElementById('gaugeVal');
  const pctEl = document.getElementById('gaugePct');
  const circle = document.getElementById('gaugeCircle');

  if (valEl) valEl.textContent = filledCount;

  const pct = Math.round((filledCount / totalItems) * 100);
  if (pctEl) pctEl.textContent = `සම්පූර්ණ වීම: ${pct}%`;

  if (circle) {
    const circumference = 2 * Math.PI * 48; // ~301.59
    const offset = circumference - (pct / 100) * circumference;
    circle.style.strokeDashoffset = offset;
  }
}

// ==========================================
// STORAGE / DRAFT / IMPORT / EXPORT
// ==========================================
function saveDraft() {
  localStorage.setItem('sen_assessment_draft', JSON.stringify(currentState));
  showToast('Draft වාර්තාව සාර්ථකව LocalStorage හි සුරකින ලදී.');
}

function autoSaveDraft() {
  localStorage.setItem('sen_assessment_draft', JSON.stringify(currentState));
}

function loadDraftOnStart() {
  const saved = localStorage.getItem('sen_assessment_draft');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      currentState = Object.assign(currentState, parsed);
    } catch(e) {
      console.error('Failed to parse saved draft', e);
    }
  }
}

function resetFormConfirm() {
  if (confirm('ඔබට සම්පූර්ණ Form එක නැවත මුල් තත්වයට පත් කිරීමට අවශ්‍යද? (නොසුරකින ලද දත්ත මකවී යනු ඇත)')) {
    currentState.info = {
      studentName: '', dob: '', gender: '', address: '', guardianName: '',
      guardianRelation: '', contactNo: '', school: '', grade: '',
      assessorName: '', assessorDesignation: '', assessmentDate: '',
      siblings: [{ name: '', age: '', edu: '', notes: '' }],
      commHistory: [{ date: '', type: '', notes: '' }]
    };
    currentState.scores = {};
    updateGauge();
    updateNavProgress();
    autoSaveDraft();
    switchSection('sec-info');
    showToast('Form එක මුල් තත්වයට පත් කරන ලදී.');
  }
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentState, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  const fileName = `SEN_Assessment_${currentState.info.studentName || 'Report'}_${new Date().toISOString().slice(0,10)}.json`;
  dlAnchorElem.setAttribute("download", fileName);
  dlAnchorElem.click();
  showToast('JSON ගොනුව සාර්ථකව Export කරන ලදී.');
}

function importData() {
  document.getElementById('importFile').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const importedState = JSON.parse(e.target.result);
      if (importedState.info && importedState.scores) {
        currentState = importedState;
        updateGauge();
        renderRailNav();
        switchSection('sec-info');
        autoSaveDraft();
        showToast('දත්ත සාර්ථකව Import කරන ලදී.');
      } else {
        alert('වලංගු නොවන JSON ගොනුවකි.');
      }
    } catch(err) {
      alert('ගොනුව කියවීමේදී දෝෂයක් සිදු විය.');
    }
  };
  reader.readAsText(file);
}

// ==========================================
// UTILS
// ==========================================
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => {
    t.classList.remove('show');
  }, 3000);
}
</script>
